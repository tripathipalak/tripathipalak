<svg xmlns="http://www.w3.org/2000/svg" width="160" height="160" viewBox="0 0 16 16" shape-rendering="crispEdges">
  <!-- ears -->
  <rect x="3" y="2" width="2" height="2" fill="#78716C"/>
  <rect x="11" y="2" width="2" height="2" fill="#78716C"/>
  <rect x="4" y="3" width="1" height="1" fill="#F9A8D4"/>
  <rect x="11" y="3" width="1" height="1" fill="#F9A8D4"/>
  <!-- head -->
  <rect x="3" y="3" width="10" height="6" fill="#A8A29E"/>
  <!-- forehead stripes -->
  <rect x="7" y="3" width="2" height="1" fill="#78716C"/>
  <rect x="6" y="4" width="1" height="1" fill="#78716C"/>
  <rect x="9" y="4" width="1" height="1" fill="#78716C"/>
  <!-- eyes -->
  <rect x="5" y="5" width="2" height="2" fill="#FDE68A"/>
  <rect x="9" y="5" width="2" height="2" fill="#FDE68A"/>
  <rect x="6" y="5" width="1" height="2" fill="#0F172A"/>
  <rect x="9" y="5" width="1" height="2" fill="#0F172A"/>
  <!-- muzzle -->
  <rect x="6" y="8" width="4" height="1" fill="#E7E5E4"/>
  <!-- nose -->
  <rect x="7" y="7" width="2" height="1" fill="#F472B6"/>
  <!-- whiskers -->
  <rect x="1" y="7" width="2" height="1" fill="#D6D3D1"/>
  <rect x="13" y="7" width="2" height="1" fill="#D6D3D1"/>
  <!-- body -->
  <rect x="4" y="9" width="8" height="4" fill="#A8A29E"/>
  <rect x="6" y="10" width="4" height="3" fill="#E7E5E4"/>
  <!-- tail -->
  <rect x="12" y="11" width="2" height="1" fill="#78716C"/>
  <rect x="13" y="9" width="1" height="2" fill="#78716C"/>
  <rect x="13" y="8" width="1" height="1" fill="#78716C"/>
  <!-- paws -->
  <rect x="4" y="13" width="3" height="2" fill="#78716C"/>
  <rect x="9" y="13" width="3" height="2" fill="#78716C"/>
</svg>
