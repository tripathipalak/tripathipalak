  <!-- eyes -->
  <rect x="5" y="3" width="3" height="3" fill="#FDE68A"/>
  <rect x="8" y="3" width="3" height="3" fill="#FDE68A"/>
  <rect x="6" y="4" width="1" height="1" fill="#0F172A"/>
